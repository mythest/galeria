<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>Moje obľúbené hry</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1020;
            --panel: #151c30;
            --purple: #8b5cf6;
            --purple-hover: #7c3aed;
            --cyan: #38bdf8;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: var(--text);
            font-family: "Trebuchet MS", Arial, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse at 76% 46%, rgba(56, 189, 248, 0.12), transparent 36%),
                linear-gradient(rgba(139, 92, 246, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.045) 1px, transparent 1px);
            background-size: auto, 42px 42px, 42px 42px;
        }

        .page {
            width: min(100%, 1080px);
            min-height: 590px;
            display: grid;
            grid-template-columns: 1fr 0.9fr;
            align-items: center;
            gap: clamp(40px, 8vw, 110px);
            padding: clamp(28px, 6vw, 76px);
            border: 1px solid rgba(139, 92, 246, 0.32);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(21, 28, 48, 0.96), rgba(11, 16, 32, 0.88));
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
            animation: appear 650ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .intro {
            max-width: 440px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 25px;
            color: var(--cyan);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            width: 24px;
            height: 2px;
            content: "";
            background: var(--purple);
        }

        h1 {
            margin: 0;
            font-size: clamp(42px, 6vw, 68px);
            line-height: 1.04;
            font-weight: 800;
        }

        h1 span {
            display: block;
            color: var(--cyan);
        }

        .description {
            max-width: 360px;
            margin: 22px 0 34px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .action {
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 22px;
            border: 1px solid var(--purple);
            border-radius: 8px;
            color: white;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 180ms ease, border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
        }

        .action-primary {
            background: var(--purple);
        }

        .action-secondary {
            background: transparent;
        }

        .action:hover {
            transform: translateY(-2px);
            border-color: var(--purple-hover);
            background-color: var(--purple-hover);
            box-shadow: 0 8px 22px rgba(124, 58, 237, 0.28);
        }

        .action:focus-visible {
            outline: 3px solid var(--cyan);
            outline-offset: 4px;
        }

        .feature {
            position: relative;
            width: 100%;
            max-width: 460px;
            justify-self: end;
            padding: 10px;
            border: 1px solid rgba(56, 189, 248, 0.48);
            border-radius: 14px;
            background: rgba(11, 16, 32, 0.7);
            box-shadow: 18px 18px 0 rgba(139, 92, 246, 0.16), 0 25px 65px rgba(0, 0, 0, 0.42);
            animation: float-in 850ms 120ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .feature img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 8px;
            object-fit: contain;
            transition: opacity 250ms ease, transform 400ms ease;
        }

        .feature.is-changing .feature-image img {
            opacity: 0;
            transform: scale(1.025);
        }

        .feature-image {
            aspect-ratio: 460 / 215;
            overflow: hidden;
            border-radius: 8px;
            background: var(--bg);
        }

        .feature-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 8px 5px;
            transition: opacity 250ms ease, transform 250ms ease;
        }

        .feature.is-changing .feature-label {
            opacity: 0;
            transform: translateY(5px);
        }

        .feature-label strong {
            font-size: 18px;
        }

        .feature-label span {
            color: var(--cyan);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float-in {
            from { opacity: 0; transform: translate(14px, 12px) rotate(2deg); }
            to { opacity: 1; transform: translate(0, 0) rotate(0); }
        }

        @media (max-width: 760px) {
            body {
                padding: 20px;
            }

            .page {
                min-height: auto;
                grid-template-columns: 1fr;
                gap: 38px;
                padding: clamp(28px, 8vw, 48px);
            }

            .feature {
                width: min(100%, 360px);
                justify-self: center;
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 12px;
            }

            .page {
                gap: 30px;
                padding: 26px 20px;
            }

            h1 {
                font-size: 42px;
            }

            .actions {
                display: grid;
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="intro" aria-labelledby="page-title">
            <p class="eyebrow">Moja galéria</p>
            <h1 id="page-title">Moje obľúbené <span>hry.</span></h1>
            <p class="description">Výber hier, ku ktorým sa rád vraciam.</p>
            <div class="actions">
                <button class="action action-primary" type="button" onclick="login()">Login</button>
                <a class="action action-secondary" href="register.html">Registrovať</a>
            </div>
        </section>

        <section class="feature" aria-label="Galéria obľúbených hier">
            <div class="feature-image">
                <img id="featured-game-image" src="dbh.jpg" alt="Detroit: Become Human">
            </div>
            <div class="feature-label">
                <strong id="featured-game-title">Detroit: Become Human</strong>
                <span id="featured-game-count" aria-live="polite">01 / 09</span>
            </div>
        </section>
    </main>

    <audio id="jozkoSound" src="kral.mp3"></audio>

    <script>
        const favoriteGames = [
            { title: "Detroit: Become Human", image: "dbh.jpg" },
            { title: "Undertale", image: "undertale.jpg" },
            { title: "Red Dead Redemption 2", image: "rdr2.jpg" },
            { title: "Minecraft", image: "mc.jpg" },
            { title: "Team Fortress 2", image: "tf2.jpg" },
            { title: "Overwatch", image: "overwatch.png" },
            { title: "F1 25", image: "f1.jpg" },
            { title: "League of Legends", image: "lol.jpg" },
            { title: "Phasmophobia", image: "phasmo.jpg" }
        ];
        const featuredImage = document.getElementById("featured-game-image");
        const featuredTitle = document.getElementById("featured-game-title");
        const featuredCount = document.getElementById("featured-game-count");
        let activeGameIndex = 0;

        function changeGame(direction) {
            activeGameIndex = (activeGameIndex + direction + favoriteGames.length) % favoriteGames.length;
            const game = favoriteGames[activeGameIndex];
            const feature = document.querySelector(".feature");
            feature.classList.add("is-changing");

            window.setTimeout(() => {
                featuredImage.src = game.image;
                featuredImage.alt = game.title;
                featuredTitle.textContent = game.title;
                featuredCount.textContent = `${String(activeGameIndex + 1).padStart(2, "0")} / ${String(favoriteGames.length).padStart(2, "0")}`;
                window.requestAnimationFrame(() => feature.classList.remove("is-changing"));
            }, 250);
        }

        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reducedMotion) {
            window.setInterval(() => changeGame(1), 5000);
        }

        function login() {
            const zvuk = document.getElementById("jozkoSound");
            zvuk.currentTime = 0;
            zvuk.play();

            setTimeout(() => {
                zvuk.pause();
                zvuk.currentTime = 0;
                window.location.href = "games.html";
            }, 2000);
        }
    </script>
</body>
</html>
