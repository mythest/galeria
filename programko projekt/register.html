
<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrácia</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #f1f5f9;

            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                linear-gradient(rgba(139, 92, 246, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.035) 1px, transparent 1px);
            background-size: 36px 36px;
        }

        .auth-box {
            width: min(100%, 450px);
            max-width: 450px;

            background: linear-gradient(145deg, #151c30, #11182b);
            border: 1px solid rgba(139, 92, 246, 0.55);
            border-radius: 14px;

            padding: 36px;
            box-sizing: border-box;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);

            animation: registerOpen 0.5s ease;
        }

        .auth-eyebrow {
            margin: 0 0 10px;
            color: #38bdf8;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-align: center;
            text-transform: uppercase;
        }

        .auth-box h2 {
            text-align: center;
            color: #38bdf8;
            font-size: 34px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .auth-description {
            margin: 0 0 28px;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }

        .auth-box label {
            display: block;
            margin-bottom: 7px;

            color: #cbd5e1;
            font-weight: bold;
        }

        .auth-box input {
            width: 100%;
            padding: 13px;

            margin-bottom: 20px;

            box-sizing: border-box;

            background: #0b1020;
            color: white;

            border: 1px solid #475569;
            border-radius: 8px;

            outline: none;

            font-size: 15px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-box input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }

        .auth-box button {
            width: 100%;
            padding: 14px;

            background: #8b5cf6;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-box button:hover {
            background: #7c3aed;
            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
        }

        .auth-box button:focus-visible {
            outline: 3px solid #38bdf8;
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            .auth-box {
                padding: 28px 22px;
            }
        }

        @keyframes registerOpen {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="auth-box">

        <p class="auth-eyebrow">Moja herná galéria</p>
        <h2>Registrácia</h2>
        <p class="auth-description">Vytvor si profil a pokračuj k svojim obľúbeným hrám.</p>

        <form onsubmit="registrovat(event)">

            <label for="meno">Meno</label>
            <input
                type="text"
                id="meno"
                placeholder="Zadaj meno"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Zadaj email"
                required
            >

            <label for="heslo">Heslo</label>
            <input
                type="password"
                id="heslo"
                placeholder="Zadaj heslo"
                required
            >

            <button type="submit">
                Zaregistrovať
            </button>

        </form>

    </div>

    <script>
        function registrovat(event) {
            event.preventDefault();

            window.location.href = "games.html";
        }
    </script>

</body>

</html>
